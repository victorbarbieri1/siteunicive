name: Atualizar base de conhecimento

on:
  schedule:
    - cron: "0 */3 * * *"    # a cada 3 horas: cursos novos/alterados
    - cron: "30 6 * * *"     # 03:30 (Brasília): verificação completa (preços, coordenação)
  workflow_dispatch:
    inputs:
      completo:
        description: "Baixar todos os cursos (não só os alterados)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-base
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sincronizar com unicive.com
        run: |
          if [ "${{ github.event.schedule }}" = "30 6 * * *" ] || [ "${{ inputs.completo }}" = "true" ]; then
            python scripts/sync.py --full
          else
            python scripts/sync.py
          fi

      - name: Análise de carreira com IA (só cursos novos/alterados)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/carreira_ia.py

      - name: Gerar site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python scripts/build.py

      - name: Salvar dados sincronizados no repositório
        run: |
          git config user.name "unicive-kb-bot"
          git config user.email "unicive-kb-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Sincronização automática com unicive.com ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
